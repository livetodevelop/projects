<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 { margin-bottom: 20px; }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
        }
        
        button {
            background: #4A90D9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover { background: #5A9FE9; }
        
        .assignment {
            background: #2d2d2d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 4px solid #4A90D9;
        }
        
        .assignment.due-soon {
            border-left-color: #f5a623;
            background: #3d3d2d;
        }
        
        .assignment.overdue {
            border-left-color: #d0021b;
            background: #3d2d2d;
        }
        
        .delete-btn {
            background: #d0021b;
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .section-title {
            margin: 20px 0 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #444;
        }
        
        .export-btn {
            background: #7ed321;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>📚 Homework Tracker</h1>
    
    <div class="form-group">
        <input type="text" id="title" placeholder="Assignment title">
    </div>
    <div class="form-group">
        <select id="subject">
            <option value="">Select subject...</option>
            <option value="Math">Math</option>
            <option value="Science">Science</option>
            <option value="English">English</option>
            <option value="History">History</option>
            <option value="Other">Other</option>
        </select>
    </div>
    <div class="form-group">
        <input type="date" id="dueDate">
    </div>
    <div class="form-group">
        <textarea id="notes" placeholder="Notes (optional)" rows="2"></textarea>
    </div>
    <button onclick="addAssignment()">Add Assignment</button>
    
    <h2 class="section-title">Due Soon (within 3 days)</h2>
    <div id="dueSoon"></div>
    
    <h2 class="section-title">All Assignments</h2>
    <div id="assignments"></div>
    
    <button class="export-btn" onclick="exportData()">Export Data</button>
    <button class="export-btn" onclick="clearAll()" style="background: #d0021b;">Clear All</button>

    <script src="homework-tracker.js"></script>
</body>
</html>
