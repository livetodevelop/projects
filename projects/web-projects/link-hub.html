<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 { 
            margin-bottom: 20px;
            text-align: center;
        }
        
        #search {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .category {
            margin-bottom: 25px;
        }
        
        .category h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #333;
        }
        
        .link {
            display: block;
            padding: 10px;
            color: #6db3f2;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .link:hover {
            background: #2d2d2d;
        }
        
        .link small {
            color: #666;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <h1>🔗 Link Hub</h1>
    
    <input type="text" id="search" placeholder="Search links..." onkeyup="filterLinks()">
    
    <div class="category" data-category="school">
        <h2>School</h2>
        <a href="https://classroom.google.com" class="link">Google Classroom</a>
        <a href="https://khanacademy.org" class="link">Khan Academy</a>
        <a href="https://desmos.com/calculator" class="link">Desmos Calculator</a>
        <a href="https://quizlet.com" class="link">Quizlet</a>
    </div>
    
    <div class="category" data-category="gaming">
        <h2>Gaming</h2>
        <a href="https://minecraft.net" class="link">Minecraft</a>
        <a href="https://hypixel.net" class="link">Hypixel Server</a>
        <a href="https://steamcommunity.com" class="link">Steam Community</a>
        <a href="https://nexusmods.com" class="link">Nexus Mods</a>
    </div>
    
    <div class="category" data-category="social">
        <h2>Social</h2>
        <a href="https://discord.com" class="link">Discord</a>
        <a href="https://reddit.com" class="link">Reddit</a>
        <a href="https://youtube.com" class="link">YouTube</a>
    </div>
    
    <div class="category" data-category="dev">
        <h2>Dev Stuff</h2>
        <a href="https://github.com" class="link">GitHub</a>
        <a href="https://stackoverflow.com" class="link">Stack Overflow</a>
        <a href="https://replit.com" class="link">Replit</a>
        <a href="https://w3schools.com" class="link">W3Schools</a>
    </div>

    <script>
        function filterLinks() {
            const query = document.getElementById('search').value.toLowerCase();
            const links = document.querySelectorAll('.link');
            
            links.forEach(link => {
                const text = link.textContent.toLowerCase();
                link.style.display = text.includes(query) ? 'block' : 'none';
            });
            
            // Hide empty categories
            document.querySelectorAll('.category').forEach(cat => {
                const visibleLinks = cat.querySelectorAll('.link[style="display: block"], .link:not([style*="display: none"])');
                let hasVisible = false;
                cat.querySelectorAll('.link').forEach(l => {
                    if (l.style.display !== 'none') hasVisible = true;
                });
                cat.style.display = hasVisible ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
