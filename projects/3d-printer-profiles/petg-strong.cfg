[profile:petg-strong]
printer = Flashforge Adventurer 5M
nozzle_diameter = 0.4
bed_type = textured_pei

# temperatures - higher than PLA
extruder_temp = 235
bed_temp = 75

# layers
layer_height = 0.24
first_layer_height = 0.28
top_layers = 4
bottom_layers = 5
wall_lines = 3

# speeds - slower for PETG
print_speed = 40
first_layer_speed = 15
travel_speed = 100

# cooling - less fan or layers won't stick together
fan_speed = 40
min_fan_speed = 30
max_fan_speed = 50

# adhesion - PETG needs more help
brim_enabled = true
brim_width = 5

# retraction
retraction_distance = 1.2
retraction_speed = 35

# notes
# - PETG strings a lot, don't expect perfect surfaces
# - don't use supports with PETG unless necessary, hard to remove
# - textured PEI can get damaged if you peel too hard when hot
