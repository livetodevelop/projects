[profile:pla-basic]
printer = Flashforge Adventurer 5M
nozzle_diameter = 0.4
bed_type = textured_pei

# temperatures
extruder_temp = 210
bed_temp = 60

# layers
layer_height = 0.2
first_layer_height = 0.24
top_layers = 3
bottom_layers = 4

# speeds
print_speed = 60
first_layer_speed = 20
travel_speed = 120

# cooling
fan_speed = 100
min_fan_speed = 80
max_fan_speed = 100

# adhesion
brim_enabled = false
skirt_lines = 2

# notes for this profile
# - good for most prints
# - if bridging is bad, increase fan to 100%
# - Z-offset might need -0.02 adjustment for textured PEI
