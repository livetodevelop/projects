<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucas' schoolwork</title>

  <style>
    :root {
      --bg: #080809;
      --panel: rgba(24, 24, 27, .86);
      --border: #343438;
      --text: #f5f5f5;
      --muted: #a2a2a8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top, #29292e 0, transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    #snow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .developer-switch {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }

    .developer-switch input {
      width: auto;
      accent-color: white;
    }

    header {
      padding: 65px 20px 35px;
      text-align: center;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 78px);
      letter-spacing: -4px;
    }

    .subtitle {
      color: var(--muted);
      margin: 18px auto 0;
      max-width: 500px;
      line-height: 1.6;
    }

    main {
      width: min(1050px, calc(100% - 32px));
      margin: auto;
      padding-bottom: 70px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0 28px;
    }

    .tab {
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-weight: bold;
    }

    .tab:hover,
    .tab.active {
      background: white;
      color: black;
    }

    .toolbar {
      margin: 15px 0 28px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--panel);
      color: white;
      font-size: 15px;
    }

    select option {
      background: #171719;
      color: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #888;
    }

    .section-title {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 13px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .link-card {
      width: 100%;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: .2s ease;
    }

    .link-card:hover {
      border-color: #888;
      background: rgba(45, 45, 49, .95);
      transform: translateY(-3px);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      margin-bottom: 17px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-weight: bold;
    }

    .link-card h3 {
      margin-bottom: 7px;
      font-size: 17px;
    }

    .link-card p {
      color: var(--muted);
      font-size: 13px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, .78);
    }

    .modal.active {
      display: grid;
    }

    .modal-box {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid #444;
      border-radius: 20px;
      background: #171719;
      box-shadow: 0 20px 80px #000;
    }

    .modal-box h2 {
      margin-bottom: 12px;
    }

    .modal-box p {
      color: var(--muted);
      line-height: 1.5;
    }

    .add-form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    #generatedArray {
      min-height: 100px;
      resize: vertical;
      font-family: monospace;
      background: #0d0d0f;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      padding: 12px 17px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .cancel {
      background: #2c2c30;
      color: white;
    }

    .launch,
    .add-link {
      background: white;
      color: black;
    }

    .add-link {
      display: none;
      margin: 28px auto 0;
    }

    .add-link.visible {
      display: block;
    }

    footer {
      padding-top: 35px;
      color: #66666d;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="snow"></canvas>

  <label class="developer-switch">
    <input type="checkbox" id="developerMode">
    developer mode
  </label>

  <header>
    <div class="eyebrow">updates a lot</div>
    <h1>lucas' schoolwork</h1>
    <p class="subtitle">make sure to bookmark this!</p>
  </header>

  <main>
    <nav class="tabs">
      <button class="tab active" data-tab="main">main</button>
      <button class="tab" data-tab="educational games">
        educational games
      </button>
      <button class="tab" data-tab="tools">tools</button>
    </nav>

    <div class="toolbar">
      <input id="search" type="search" placeholder="search links...">
    </div>

    <div class="section-title" id="sectionTitle">main:</div>
    <section class="links" id="links"></section>

    <button class="add-link" id="addLinkButton">
      get link array
    </button>

    <footer>just to be clear i didnt make any of these links, i just find them</footer>
    <footer>also special thanks to leo and matthew for being cool</footer>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2>launch a website</h2>
      <p>open this in a new tab?</p>

      <div class="actions">
        <button class="cancel" id="cancel">
          no, i HATE good proxies
        </button>
        <button class="launch" id="launch">launch!</button>
      </div>
    </div>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-box">
      <h2>add link</h2>
      <p>for lucas</p>

      <div class="add-form">
        <input id="linkName" type="text" placeholder="Name">
        <input id="linkUrl" type="url" placeholder="https://example.com">

        <select id="linkTab">
          <option value="main">main</option>
          <option value="educational games">educational games</option>
          <option value="tools">tools</option>
        </select>

        <textarea
          id="generatedArray"
          readonly
          placeholder="Generated array will appear here"
        ></textarea>
      </div>

      <div class="actions">
        <button class="cancel" id="closeAddModal">cancel</button>
        <button class="launch" id="copyArray">copy array</button>
      </div>
    </div>
  </div>

  <script>
    const websites = [
      ["lucide", "https://s3.amazonaws.com/googleclass/index.html", "L", "main"],
      ["lucide 2", "https://s3.amazonaws.com/schoolsucks/index.html", "L", "main"],
      ["lucide 3", "https://script.google.com/a/macros/fcpsschools.net/s/AKfycbw_rj7a3fmTQELYynIo1pI3wl2DmRdE81xPeuebaUSRB7OEBfvW3jl5V6dd8Vss9uxI/exec", "L", "main"],
      ["bull-33", "https://s3.dualstack.us-east-1.amazonaws.com/jlkl/index.html?r=g", "B", "main"],
      ["bull-33 2", "https://s3.amazonaws.com/oiop/index.html", "B", "main"],
      ["monoxide", "https://freeram.b-cdn.net/", "M", "main"],
      ["monoxide 2", "https://destroyeducation.b-cdn.net/", "M", "main"],
      ["korona", "https://edu.wastedmc.net/", "K", "main"],
      ["catclass", "https://s3.amazonaws.com/catclassgoat/index.html", "C", "main"],
      ["gust", "https://clintissotuff.b-cdn.net/", "G", "main"],
      ["chalkle", "https://script.google.com/a/macros/fcpsschools.net/s/AKfycbztNsd9Ko4-rutPUkkOiKJz5RoBkkkONYkJp1OCDdvRLOFRj1Fb-3COf816fPnbogoo/exec", "C", "main"],
      ["tung tung", "https://s3.amazonaws.com/zoxh/index.html", "T", "main"],
      ["fern", "https://s3.amazonaws.com/2027games/index.html", "F", "main"],
      ["cineby movies", "https://cineby.ws/movies", "C", "tools"],
      ["opstream movies (not very good)", "http://opstream.fun", "O", "tools"],
      ["deltarune & undertale", "https://script.google.com/a/macros/fcpsschools.net/s/AKfycby9_53Lpofj0XzMEqnbPZjeS5puKZDy-OuwGx6rMW48GykAYASRckK6KWcBPztj9ag3/exec", "T", "educational games"],
      ["minecraft 1.12", "https://script.google.com/a/macros/fcpsschools.net/s/AKfycby6hNrYFUtSWI699tVjOx87WwDg1jQH-qCZjbmttsjjA_mAotwMXww9uQvXz80Srv5p/exec", "M", "educational games"],
      ["minecraft 1.21 (takes a while to load)", "https://htmlhoster.com/p/QY0W7PQE/", "M", "educational games"],
      ["minecraft dragonx", "https://htmlhoster.com/p/S6G4AFSB/", "M", "educational games"],
      ["oreate (ai)", "https://www.oreateai.com/home/index", "O", "tools"]
    ];

    let selectedTab = "main";
    let selectedUrl = "";

    const links = document.getElementById("links");
    const search = document.getElementById("search");
    const modal = document.getElementById("modal");
    const sectionTitle = document.getElementById("sectionTitle");
    const tabs = document.querySelectorAll(".tab");

    function render(filter = "") {
      links.innerHTML = "";

      const results = websites.filter(site => {
        const name = site[0].toLowerCase();
        return site[3] === selectedTab &&
          name.includes(filter.toLowerCase());
      });

      if (results.length === 0) {
        links.innerHTML = `
          <p style="color:#a2a2a8;">No links found.</p>
        `;
        return;
      }

      results.forEach(site => {
        const card = document.createElement("button");
        card.className = "link-card";

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = site[2];

        const title = document.createElement("h3");
        title.textContent = site[0];

        const description = document.createElement("p");
        description.textContent = "schoolwork resource";

        card.append(icon, title, description);

        card.onclick = () => {
          selectedUrl = site[1];
          modal.classList.add("active");
        };

        links.appendChild(card);
      });
    }

    tabs.forEach(tab => {
      tab.onclick = () => {
        selectedTab = tab.dataset.tab;

        tabs.forEach(item => {
          item.classList.toggle("active", item === tab);
        });

        sectionTitle.textContent = `${selectedTab}:`;
        render(search.value);
      };
    });

    search.oninput = () => render(search.value);

    document.getElementById("cancel").onclick = () => {
      modal.classList.remove("active");
    };

    document.getElementById("launch").onclick = () => {
      const win = window.open("", "_blank");

      if (!win) {
        alert("Please allow pop-ups for this site.");
        return;
      }

      const safeUrl = encodeURI(selectedUrl);

      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Loading...</title>
          <style>
            html, body, iframe {
              width: 100%;
              height: 100%;
              margin: 0;
              border: 0;
              overflow: hidden;
              background: #000;
            }
          </style>
        </head>
        <body>
          <iframe src="${safeUrl}" allowfullscreen></iframe>
        </body>
        </html>
      `);

      win.document.close();
      modal.classList.remove("active");
    };

    modal.onclick = event => {
      if (event.target === modal) {
        modal.classList.remove("active");
      }
    };

    const developerMode = document.getElementById("developerMode");
    const addLinkButton = document.getElementById("addLinkButton");
    const addModal = document.getElementById("addModal");
    const closeAddModal = document.getElementById("closeAddModal");
    const linkName = document.getElementById("linkName");
    const linkUrl = document.getElementById("linkUrl");
    const linkTab = document.getElementById("linkTab");
    const generatedArray = document.getElementById("generatedArray");
    const copyArray = document.getElementById("copyArray");

    developerMode.onchange = () => {
      addLinkButton.classList.toggle(
        "visible",
        developerMode.checked
      );
    };

    addLinkButton.onclick = () => {
      linkTab.value = selectedTab;
      addModal.classList.add("active");
      linkName.focus();
    };

    closeAddModal.onclick = () => {
      addModal.classList.remove("active");
    };

    addModal.onclick = event => {
      if (event.target === addModal) {
        addModal.classList.remove("active");
      }
    };

    function escapeValue(value) {
      return value
        .replace(/\\/g, "\\\\")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n");
    }

    function generateArray() {
      const name = linkName.value.trim();
      const url = linkUrl.value.trim();
      const tab = linkTab.value;

      if (!name || !url) {
        generatedArray.value = "";
        return;
      }

      const icon = name.charAt(0).toUpperCase();

      generatedArray.value =
        `["${escapeValue(name)}", ` +
        `"${escapeValue(url)}", ` +
        `"${icon}", ` +
        `"${escapeValue(tab)}"],`;
    }

    linkName.oninput = generateArray;
    linkUrl.oninput = generateArray;
    linkTab.onchange = generateArray;

    copyArray.onclick = async () => {
      if (!generatedArray.value) return;

      await navigator.clipboard.writeText(generatedArray.value);
      copyArray.textContent = "copied";

      setTimeout(() => {
        copyArray.textContent = "copy array";
      }, 1200);
    };

    render();

    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d");
    let flakes = [];

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;

      flakes = Array.from({ length: 130 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.5 + .5,
        speed: Math.random() * 1.2 + .4,
        drift: Math.random() * .8 - .4
      }));
    }

    function snow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(255,255,255,.7)";

      flakes.forEach(flake => {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fill();

        flake.y += flake.speed;
        flake.x += flake.drift;

        if (flake.y > canvas.height) {
          flake.y = -5;
          flake.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(snow);
    }

    addEventListener("resize", resize);
    resize();
    snow();
  </script>
</body>
</html>
